name: Install LibreOffice for document artifact acceptance
description: Supply the real renderer required by the DOCX template pack release gate.
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends libreoffice-writer libreoffice-draw libreoffice-impress libreoffice-calc fuse3 libfuse3-3
        sudo modprobe fuse
        test -c /dev/fuse
        sudo chmod a+rw /dev/fuse
    - if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: brew install --cask libreoffice
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $msi = Join-Path $env:RUNNER_TEMP 'winfsp-2.1.25156.msi'
        Invoke-WebRequest 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi' -OutFile $msi
        if ((Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant() -ne '073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a') {
          throw 'Official WinFsp installer digest differs'
        }
        $installer = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', 'ADDLOCAL=ALL') -Wait -PassThru -WindowStyle Hidden
        if ($installer.ExitCode -notin @(0, 3010)) { throw "WinFsp installation failed: $($installer.ExitCode)" }
        choco install libreoffice-fresh --yes --no-progress
        if ($LASTEXITCODE -ne 0) { throw 'LibreOffice installation failed' }
