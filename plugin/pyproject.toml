[project]
name = "elftia-document-skills"
version = "0.5.7"
description = "Shared Python facade for the Elftia document Agent Skills project"
requires-python = ">=3.11"
license = { text = "GPL-3.0" }
dependencies = [
  "cryptography==50.0.0",
  "defusedxml==0.7.1",
  "fonttools==4.63.0",
  "jsonschema==4.25.1",
  "pillow==12.3.0",
  "python-bidi==0.6.11",
  "pypdf==6.16.2",
  "uharfbuzz==0.56.0",
]

[dependency-groups]
dev = [
  "openpyxl==3.1.5",
  "pymupdf==1.27.2.2",
  "pytest==8.4.1",
  "pytest-xdist==3.7.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
markers = [
  "slow: exercises a real external provider (LibreOffice, dotnet helper, PDF rendering); excluded by npm run test:fast",
]

[tool.uv]
package = false
