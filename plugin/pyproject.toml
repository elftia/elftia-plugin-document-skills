[project]
name = "elftia-document-skills"
version = "0.1.0"
description = "Shared Python facade for the Elftia document Agent Skills project"
requires-python = ">=3.11"
license = { text = "GPL-3.0" }
dependencies = [
  "cryptography==50.0.0",
  "defusedxml==0.7.1",
  "jsonschema==4.25.1",
  "pypdf==6.16.2",
]

[dependency-groups]
dev = [
  "openpyxl==3.1.5",
  "pymupdf==1.27.2.2",
  "pytest==8.4.1",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.uv]
package = false
