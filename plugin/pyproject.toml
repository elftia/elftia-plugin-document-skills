[project]
name = "elftia-document-skills"
version = "0.1.0"
description = "Shared Python facade for the Elftia document Agent Skills project"
requires-python = ">=3.11"
license = { text = "GPL-3.0" }
dependencies = [
  "defusedxml==0.7.1",
  "jsonschema==4.25.1",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.uv]
package = false
